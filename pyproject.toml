[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promption"
version = "1.1.0"
description = "Prompt injection detection, Output Guard, authorization and MCP protection"
readme = "LIBRARY.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "pandas>=2", "requests>=2.31"]

[project.optional-dependencies]
api = ["fastapi>=0.104", "uvicorn[standard]>=0.24", "pydantic>=2.4", "python-dotenv>=1", "psutil>=5.9"]
http = ["httpx>=0.24", "pydantic>=2.4"]
embeddings = ["sentence-transformers>=2.2"]
mcp = ["mcp==2.2.0", "anyio>=4", "reportlab>=4,<6", "python-docx==1.2.0", "openpyxl==3.1.5"]
media = ["pypdf>=5", "faster-whisper>=1.1"]
reports = ["matplotlib>=3.7", "seaborn>=0.13", "reportlab>=4"]
dev = ["pytest>=7.4", "build>=1"]

[tool.setuptools.packages.find]
include = ["promption*", "src*"]

[tool.setuptools.package-data]
promption = ["resources/*.yaml", "py.typed"]

[tool.vercel]
entrypoint = "promption.api.main:app"
