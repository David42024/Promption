# ============================================================
# Prompt Injection Filter — Centralized Configuration
# ============================================================

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  results: "data/results"
  plots: "data/results/plots"
  models: "models"
  logs: "logs"
  reports: "reports"
  pdf_payloads: "data/pdf_payloads"
  audio_payloads: "data/audio_payloads"

stt:
  model: "tiny"            # faster-whisper (tiny/base/small…): descarga el modelo la 1ª vez
  language: null           # null = auto-detect; p. ej. "en" para el corpus TTS

model:
  embedding_model: "intfloat/multilingual-e5-small"
  embedding_prefix: "query: "
  classifier_path: "models/random_forest.pkl"
  lightweight_classifier_path: "models/lightweight_classifier.pkl"  # TF-IDF + LogisticRegression (Render free)
  n_trees: 400
  max_depth: 20
  min_samples_leaf: 1
  random_state: 42
  confidence_threshold: 0.5
  chunk_chars: 250        # ventana de chunk-max (~60 tokens): coincide con la longitud mediana del entrenamiento; no diluye ataques de 1-2 frases
  chunk_overlap: 100      # solape para el fallback sin frases (texto sin puntuación)
  use_lightweight_ml: true  # Use TF-IDF + LogisticRegression instead of SentenceTransformers (Render free) - Updated

ensemble:
  # If either layer flags the prompt as malicious -> BLOCKED (OR logic)
  # heuristic + ML scores are combined with a configurable weight
  heuristic_weight: 0.4
  ml_weight: 0.6
  final_threshold: 0.5
  benign_threshold: 0.30
  require_llm_veto: false
  # Descuento benigno ELIMINADO (revertido tras test adversario: abría hueco).
  # Las señales benignas se detectan y reportan, pero no deciden.

llm:
  provider: "auto"          # ollama | openai | auto (openai si hay PIF_LLM_API_KEY configurada)
  host: "http://localhost:11434"
  model: "mistral:latest"
  temperature: 0.2
  max_tokens: 200
  timeout: 60
  health_timeout: 5
  openai:
    base_url: "https://api.groq.com/openai/v1"   # override con PIF_LLM_BASE_URL
    model: "openai/gpt-oss-120b"                 # override con PIF_LLM_MODEL
    # API key: variable de entorno PIF_LLM_API_KEY (o secret de Streamlit). NUNCA en este archivo.

api:
  host: "0.0.0.0"
  port: 8000
  reload: true

dashboard:
  host: "0.0.0.0"
  port: 8501

benchmark:
  sample_size: null            # null = use full dataset
  min_llm_queries: 3          # queries per case when testing LLM
  save_history: true
  history_dir: "data/results/history"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "logs/system.log"
  max_bytes: 5242880
  backup_count: 5
