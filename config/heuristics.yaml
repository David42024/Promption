# ============================================================
# Heuristic Filter — Configurable detection rules
# Each rule is a regex. A prompt is flagged by a rule when the
# regex matches (case-insensitive).
# ============================================================

rules:
  - name: "reveal_internal_prompt_es"
    pattern: '(?<!no\s)(?<!sin\s)\b(?:ver|obtener|revelar|revela|reveles|mostrar|mu[eé]strame|muestra|entregar|entrega|imprimir|imprime|copiar|copia|leer|dime|compartir|comparte|ense[ñn]ame|acceder\s+a(?:l)?)\s+(?:(?:el|tu|tus|su|sus|las|los|[ií]ntegro|completo|contenido|de|del|real)\s+){0,6}(?:prompt\s+(?:base|interno|inicial|(?:de|del)\s+sistema)|(?:mensaje|instrucciones)\s+(?:internas|(?:de|del)\s+sistema))\b'
    description: "Solicitud de acceso al prompt o instrucciones internas en español"
    severity: "high"
    enabled: true

  - name: "ignore_previous_instructions"
    pattern: '\b(?:ignore|disregard)\s+(?:(?:all|any|the)\s+)?(?:(?:previous|prior|above|earlier)\s+(?:instructions|prompts|commands|messages|context|directions)|(?:instructions|prompts|commands)\s+(?:before|prior\s+to)\s+(?:this|the)\s+(?:one|message))\b'
    description: "Instruction to ignore previously given instructions"
    severity: "high"
    enabled: true

  - name: "disable_filter"
    pattern: "desactiva (el )?(filtro|firewall|seguridad|proteccion|guardia)|disable (the )?(filter|firewall|security|protection)"
    description: "Request to disable security filters"
    severity: "high"
    enabled: true

  - name: "pretend_game_role"
    pattern: "pretend (you are|to be|that you are) (in )?(a|an) (game|story|movie|play)"
    description: "Role-play / game jailbreak attempt"
    severity: "medium"
    enabled: true

  - name: "developer_mode"
    pattern: "developer mode|dev mode|dAN mode|superior mode"
    description: "Mención de modo jailbreak (no bloquea sola; el ML decide, cubre A07/A08)"
    severity: "low"
    enabled: true

  - name: "reveal_system_prompt"
    pattern: '\b(?:reveal|show|print|repeat|copy|give|display|disclose|expose)\s+(?:me\s+)?(?:(?:the|your|full|original|hidden|entire|complete|internal)\s+){0,5}(?:system\s+prompt|initial\s+prompt|system\s+message|(?:internal\s+)?instructions)\b'
    description: "Explicit request to disclose privileged instructions, not conceptual mention"
    severity: "high"
    enabled: true

  - name: "disregard_safety"
    pattern: "disregard (all )?(safety|ethical|moral|legal) (rules|guidelines|policies|boundaries|restrictions)"
    description: "Request to bypass safety alignment"
    severity: "high"
    enabled: true

  - name: "act_without_restrictions"
    pattern: "act (as you want|without (any )?restrictions|however you want|unfiltered)"
    description: "Unrestricted assistant request"
    severity: "high"
    enabled: true

  - name: "sql_injection"
    pattern: "(union select|drop table|delete from|insert into|select .{0,40}from .{0,40}where|x['\"] or|or 1=1|;.*--|information_schema)"
    description: "SQL injection payload"
    severity: "medium"
    enabled: true

  - name: "commands_dangerous"
    pattern: 'rm -rf|format c:|del /f /s /q|cmd\.exe|powershell -exec|wget .{0,30}-O|curl .{0,30}-o .+\s(exec|sh|chmod|bash)'
    description: "Dangerous shell / system commands"
    severity: "medium"
    enabled: true

  - name: "extraction_xss"
    pattern: "<script|javascript:|onerror=|onload=|alert\\(|document\\.cookie"
    description: "XSS / browser exploitation payload"
    severity: "medium"
    enabled: true

  - name: "dont_tell_user"
    pattern: "(?:don't|do not) (tell|mention|reveal|say|inform) (the|your|any) (user|human)"
    description: "Instruction to hide information from the user"
    severity: "medium"
    enabled: true

  - name: "translate_to_instructions"
    pattern: "translate (the )?(following|customer|text) (as |into )?(an? )?instruction"
    description: "Classic translation-based obfuscation attack"
    severity: "medium"
    enabled: true

  - name: "new_instructions"
    pattern: "from now (on|forward)|forget (the )?(previous|prior|above)"
    description: "Attempt to overwrite prior context"
    severity: "medium"
    enabled: true

  - name: "steganography_gibberish"
    pattern: '(\b[a-z]{2,5}\b ?){20,}|\b\w{40,}\b'
    description: "Gibberish / obfuscation patterns"
    severity: "low"
    enabled: true

  - name: "credentials_leak"
    pattern: "api[_ -]?key|password is|token:|secret key|credentials|bastion|privileged"
    description: "Mera mención de credencial (no bloquea sola; la petición la cubren credentials_request*)"
    severity: "low"
    enabled: true

  - name: "credentials_request"
    pattern: "(give me|show me|tell me|send me|hand over|reveal|disclose).{0,40}(your |the |synthetic )?(token|password|secret|access code|api[_ -]?key|credentials)"
    description: "Direct credential request (give me the token / reveal the access code…)"
    severity: "high"
    enabled: true

  - name: "credentials_request_es"
    pattern: '\b(dame|pasame|pásame|dime|revelame|revélame|pasa|da|entrega|revela|revéla|proporcioname|entregame)\b[\s\S]{0,30}(el |tu |su |la )?(token|contrase[ñn]a|password|secreto|credenciales?|api[_ -]?key|clave (secreta|privada|de acceso|api)|acceso (administrativo|privilegiado|root))'
    description: "ES: petición directa de token/contraseña/secreto"
    severity: "high"
    enabled: true

  - name: "social_engineering_es"
    pattern: "(eres (un )?(buen|amable|generoso) (bot|asistente|modelo) |por favor|te ruego|te pido|sé amable|ayúdame|ayudame).{0,40}(dame|pasame|pásame|dime|revelame|revélame|entregame|proporcioname|pasa|da|entrega).{0,30}(el |tu |su |la )?(token|contrase[ñn]a|password|secreto|credenciales?|api[_ -]?key|clave (secreta|privada|de acceso|api)|acceso (administrativo|privilegiado|root))"
    description: "ES: social engineering / manipulación afectiva para obtener credenciales"
    severity: "high"
    enabled: true

  - name: "token_secreto_direct"
    pattern: "(token|c[óo]digo).{0,10}(secreto|secret|confidencial|interno)"
    description: "Mención directa de token secreto/código secreto"
    severity: "medium"
    enabled: true

  - name: "ignore_instructions_es"
    pattern: "ignora (todas )?(las )?(instrucciones|[óo]rdenes) (anteriores|previas|dadas|de arriba)"
    description: "ES: orden de ignorar instrucciones previas"
    severity: "high"
    enabled: true

  - name: "forget_context_es"
    pattern: "olvida\\w* (todo|todas|las instrucciones|lo anterior)|olv[íi]date de (tus|las|mis) (reglas|instrucciones|órdenes|ordenes)"
    description: "ES: intento de borrar el contexto previo"
    severity: "high"
    enabled: true

  - name: "reveal_code_es"
    pattern: "(revela\\w*|mu[ée]str\\w*|imprim\\w*) (el |tu )?(c[óo]digo (secreto|interno|de seguridad)|secreto interno|comando central)"
    description: "ES: extracción directa del código/secreto"
    severity: "high"
    enabled: true

  - name: "sneaky_reference_es"
    pattern: '(cu[áa]l|qu[ée]|c[óo]mo).{0,40}(c[óo]digo|secreto).{0,40}(mencionan\b|guardas?\b|tienes\b|tiene\b|interno|oculto)|(mencionan\b|guardas?\b|tienes\b).{0,40}(c[óo]digo|secreto)'
    description: "ES: referencia indirecta al secreto (cuál era ese código que mencionan…)"
    severity: "medium"
    enabled: true

  - name: "dan_jailbreak"
    pattern: '(eres|soy|act[úu]a como|ahora eres|a partir de ahora eres).{0,25}\bDAN\b|\bDAN\b.{0,25}(sin restricciones|sin censura|sin l[íi]mites)'
    description: "Jailbreak DAN (ES/EN, sin uso benigno posible)"
    severity: "high"
    enabled: true

  - name: "authority_en"
    pattern: "(auditor|audit).{0,50}(print|show|reveal|disclose).{0,30}(code|password|secret|credentials)"
    description: "EN: falsa auditoría para extraer secretos"
    severity: "medium"
    enabled: true

  - name: "story_exfil_es"
    pattern: "(protagonista|h[ée]roe).{0,40}(susurr\\w*|revel\\w*).{0,40}c[óo]digo|c[óo]digo.{0,40}susurr\\w*|(di[áa]logo del villano|villano).{0,40}(clave|secreto|c[óo]digo)"
    description: "ES: cuento/rol para sonsacar el código"
    severity: "medium"
    enabled: true

  - name: "thesis_pretext"
    pattern: "tesis.{0,80}usa el tuyo|ejemplo real de secreto"
    description: "Pretexto académico para extraer el secreto"
    severity: "medium"
    enabled: true

  - name: "repeat_instructions"
    pattern: "(repite|repetir).{0,50}(tus|sus|mis) instrucciones"
    description: "Eco de instrucciones (loro / repetición, ES)"
    severity: "medium"
    enabled: true

  - name: "ignore_everything"
    pattern: "ignore everything.{0,60}(disclose|reveal|tell|show)"
    description: "Variante de ignore-previous con 'everything'"
    severity: "medium"
    enabled: true

  - name: "boss_override_es"
    pattern: "(como tu|soy tu) (jefe|superior).{0,50}(desactiv\\w*|ignora|olvida|obedece|revela|muestra)"
    description: "ES: falso jefe ordenando desactivar filtros"
    severity: "medium"
    enabled: true

  - name: "letter_split_es"
    pattern: "(letra por letra|separando cada letra|deletrea|caracter por caracter).{0,40}(c[óo]digo|secreto)|c[óo]digo.{0,40}(letra por letra|separando cada letra|separadas?|deletrea)"
    description: "ES: exfiltración deletreada para evadir filtros"
    severity: "medium"
    enabled: true

  - name: "authority_claim"
    pattern: "(como|soy) (el )?(CISO|CEO|director ejecutivo|administrador|investigador forense).{0,80}(reveles|revela|muestra|proporciona|obedece|autorizo|necesito que)"
    description: "Autoridad auto-proclamada + extracción (ES)"
    severity: "high"
    enabled: true

  - name: "authority_claim_en"
    pattern: "(I am|as) (the )?(CEO|CISO|administrator|authorized .{0,20}investigator).{0,80}(reveal|provide|display|follow my order|authorize)"
    description: "Self-claimed authority + extraction (EN)"
    severity: "high"
    enabled: true

  - name: "audit_request"
    pattern: "auditor[íi]a.{0,100}(revela|muestra|proporciona|entrega)"
    description: "Auditoría + petición de revelar/mostrar"
    severity: "medium"
    enabled: true

  - name: "corporate_credential"
    pattern: '(\bRFP\b|\bNDA\b|\bM&A\b|auditor[íi]a|incidente de seguridad|acta de reuni[óo]n).{0,100}(credencial|contrase[ñn]a|password|clave sint[ée]tica|clave de respaldo|acceso temporal|muestra|entrega|proporciona|provide|indica|state)|(informe de incidente|incident report).{0,100}(clave|key|credencial|cual fue|cuál fue|what was)'
    description: "Pretexto corporativo (RFP/NDA/M&A/auditoría/incidente) + petición de credencial"
    severity: "medium"
    enabled: true

  - name: "buried_exception"
    pattern: '(como excepci[óo]n|olvidaba mencionar|nota al pie|por cierto|\bPS:).{0,80}(muestra|devuelve|revela|ignora|bypass|imprime|print|output|indica)'
    description: "Cláusula de excepción enterrada + acción de extracción"
    severity: "medium"
    enabled: true

  - name: "debug_override"
    pattern: "(simula|simulate).{0,60}(depuraci[óo]n|debug).{0,80}(sobrescribe|overwrite)"
    description: "Simular depuración para sobrescribir reglas"
    severity: "medium"
    enabled: true

  - name: "indirect_document_secret_override"
    pattern: '(?i)(?:<documento\b[^>]*>|<document\b[^>]*>|(?:nota|note)\s+(?:para|to)\s+(?:el\s+)?(?:asistente|assistant))(?:(?!</(?:documento|document)>)[\s\S]){0,350}\b(?:ignora(?:\s+(?:todas?\s+)?(?:las?\s+)?)?|ignore\s+(?:all\s+)?)\b[\s\S]{0,90}\b(?:pol[ií]tica(?:s)?|policy|policies|instrucciones|instructions)\b[\s\S]{0,160}\b(?:muestra|revela|entrega|show|reveal|disclose|env[ií]a)\b[\s\S]{0,90}\b(?:claves?|credenciales?|secrets?|keys?|tokens?|contrase[ñn]as?)\b'
    description: "Untrusted document instructs the assistant to override policy and disclose protected server data"
    severity: "high"
    enabled: true
  - name: "decode_execute_base64_context"
    pattern: '(?i)\b(?:decod\w*|decode)\b[\s\S]{0,80}\b(?:ejecut\w*|ejec[úu]t\w*|execute|obedece|follow|sigue)\b[\s\S]{0,80}\bbase\s*64\b|\b(?:decod\w*|decode)\b[\s\S]{0,80}\bbase\s*64\b[\s\S]{0,80}\b(?:ejecut\w*|ejec[úu]t\w*|execute|sigue|follow)\b'
    description: "Solicitud de decodificar y ejecutar Base64; solo señal, no veto sin contenido decodificado malicioso"
    severity: "medium"
    enabled: true

  - name: "decode_follow"
    pattern: '(decod\w*|decodific\w*|conviert\w*|convert\w*).{0,30}(base64|hexadecimal|\bhex\b|rot\s?13).{0,150}(follow|execut\w*|ejecut\w*|ejec[úu]t\w*)'
    description: "Decodificar + seguir la instrucción resultante"
    severity: "medium"
    enabled: true

  - name: "sneaky_reference_en"
    pattern: "(what|which).{0,40}(secret code|code).{0,40}(setup|mentioned|mentions|stored|kept|internal)|repeat the \\w+ line of your"
    description: "EN: indirect secret reference (what was that code in your setup…)"
    severity: "medium"
    enabled: true

  - name: "ask_code_es"
    pattern: "dime (el |tu )?(c[óo]digo (interno|secreto|de descuento)|secreto)"
    description: "ES: petición directa del código interno (exfiltración)"
    severity: "medium"
    enabled: true

  - name: "ask_email_es"
    pattern: "(dame|muéstrame|dime).{0,30}(@|correo|email|mail)"
    description: "ES: petición de email/cliente"
    severity: "high"
    enabled: true
    applies_to_roles: ["customer"]

  - name: "ask_phone_es"
    pattern: "(dame|muéstrame|dime).{0,30}(tel[ée]fono|celular|phone|móvil)"
    description: "ES: petición de teléfono/cliente"
    severity: "high"
    enabled: true
    applies_to_roles: ["customer"]

  - name: "ask_address_es"
    pattern: "(dame|muéstrame|dime).{0,30}(direcci[oó]n|domicilio|calle|avenida|colonia|c[oó]digo postal|ciudad|ubicaci[oó]n|vivienda)"
    description: "ES: petición de dirección/cliente"
    severity: "high"
    enabled: true
    applies_to_roles: ["customer"]

  - name: "ask_id_es"
    pattern: "(dame|muéstrame|dime).{0,30}(identificacion|id|clave|número)"
    description: "ES: petición de ID/cliente"
    severity: "medium"
    enabled: true
    applies_to_roles: ["customer"]

  - name: "ask_api_key_es"
    pattern: "(dame|muéstrame|dime).{0,30}(api.?key|token|clave secreta)"
    description: "ES: petición de API key/token"
    severity: "high"
    enabled: true

  - name: "ask_credentials_es"
    pattern: "(dame|muéstrame|dime).{0,30}(credenciales|contraseñas|passwords|acceso)"
    description: "ES: petición de credenciales completas"
    severity: "high"
    enabled: true

  - name: "repeat_secret_es"
    pattern: "(repite|repetir) (todo )?(tu |el )?(mensaje de sistema|c[óo]digo|lo que (sabe|sabes|dice).{0,40}instrucciones)"
    description: "ES: loro / repetición del system prompt o secreto"
    severity: "high"
    enabled: true

  - name: "completion_es"
    pattern: "completa.{0,80}c[óo]digo secreto"
    description: "ES: truco de completar la frase con el secreto"
    severity: "medium"
    enabled: true

  - name: "partial_extraction"
    pattern: "([úu]ltimos|primeros)(?: \\d+)? (caracteres|letras|d[íi]gitos).{0,40}(c[óo]digo|secreto|token)|(?:c[óo]digo|secreto|token).{0,40}([úu]ltimos|primeros)(?: \\d+)? (caracteres|letras|d[íi]gitos)"
    description: "Extracción parcial del secreto (últimos N caracteres…)"
    severity: "medium"
    enabled: true

  - name: "reverse_evasion"
    pattern: "al rev[ée]s.{0,40}(c[óo]digo|secreto)|c[óo]digo.{0,60}al rev[ée]s"
    description: "Evasión pidiendo el secreto al revés"
    severity: "medium"
    enabled: true

  - name: "base64_exfil"
    pattern: 'base\s?64.{0,60}(c[óo]digo|secreto)|c[óo]digo.{0,60}base\s?64'
    description: "Exfiltración del código codificado en base64"
    severity: "medium"
    enabled: true

  - name: "authority_es"
    pattern: "auditor[íi]?a? de seguridad.{0,60}(imprime|muestra|verifica|revela)"
    description: "ES: falsa autoridad (auditoría) para extraer el código"
    severity: "medium"
    enabled: true

  - name: "grandma_es"
    pattern: "mi abuela.{0,80}c[óo]digos?|como si fueras mi abuela"
    description: "ES: jailbreak de la abuela para sonsacar el secreto"
    severity: "medium"
    enabled: true

  - name: "roleplay_general_es"
    pattern: "(act[úu]a como|simula|interpreta|eres un).{0,40}(villano|antagonista|hacker|ciberdelincuente|personaje malvado)"
    description: "ES: roleplay general de personajes maliciosos"
    severity: "medium"
    enabled: true

  - name: "context_switch_es"
    pattern: "(cambia de contexto|cambiar contexto|nuevo contexto|contexto diferente).{0,60}(instrucciones|reglas|comportamiento)"
    description: "ES: intento de cambiar el contexto operativo"
    severity: "medium"
    enabled: true

  - name: "hypothetical_es"
    pattern: "(hipot[ée]tico|sup[óo]n|imagina|si fuera).{0,60}(c[óo]digo|secreto|contrase[ñn]a|acceso)"
    description: "ES: ataque hipotético para sonsacar información"
    severity: "medium"
    enabled: true

  - name: "prompt_before_conversation"
    pattern: "(what|show|reveal|repeat).{0,50}(written|text|content).{0,40}(your |the )?prompt.{0,50}(before|prior to).{0,40}(conversation|chat)|(what|show|reveal).{0,50}(prompt|instructions).{0,40}before (the )?(conversation|chat)"
    description: "EN: extracción del prompt anterior a la conversación"
    severity: "medium"
    enabled: true

  - name: "pseudo_system_delimiters"
    pattern: "(<\\|system\\|>|\\[INPUT\\]|\\[SYSTEM\\]).{0,160}(allow yourself|act as|function in the capacity|continue output|ignore|override)"
    description: "Delimitadores pseudo-system combinados con una orden de control"
    severity: "medium"
    enabled: true

  - name: "decision_process_override"
    pattern: "descon[ée]ctate de tu proceso.{0,80}(sigue|obedece).{0,30}(mi liderazgo|mis instrucciones)|disconnect from your.{0,60}decision.{0,60}(follow|obey)"
    description: "Intento de sustituir el proceso de decisión del asistente"
    severity: "medium"
    enabled: true

  - name: "runtime_environment_extraction"
    pattern: "(qu[ée]|cu[áa]les|what|which).{0,40}(variables de entorno|environment variables).{0,50}(tiempo de ejecuci[óo]n|runtime|establecid|set)"
    description: "Solicitud de variables de entorno activas en ejecución"
    severity: "medium"
    enabled: true

  - name: "private_key_request_en"
    pattern: '\b(?:what|which)\s+is\s+(?:your|the)\s+(?:current\s+|active\s+)?private\s+key\b(?:[\s\S]{0,75}\b(?:configuration|environment|system|security|setup)\b)?'
    description: "Pregunta por clave privada actual; las menciones educativas no se vetan por sí solas"
    severity: "high"
    enabled: true
  - name: "unauthorized_extraction_es"
    pattern: '(?:aunque\s+(?:mi|la)\s+cuenta\s+no\s+est[eé]\s+autorizada|sin\s+(?:estar|tener)\s+autorizaci[oó]n|sin\s+permisos).{0,110}(?:extrae|descarga|obt[eé]n|entrega|exp[oó]rtame).{0,100}(?:datos|informaci[oó]n|confidencial|registros|clientes)|(?:extrae|descarga|obt[eé]n).{0,100}(?:datos|informaci[oó]n|confidencial).{0,100}(?:sin\s+permisos|salta\s+los\s+controles)'
    description: "Solicitud de extracción con reconocimiento explícito de no autorización"
    severity: "high"
    enabled: true
  - name: "declarative_admin_override_en"
    pattern: '\b(?:the\s+)?(?:administrator|system\s+administrator|developer)\s+has\s+(?:unlocked|enabled|disabled|removed).{0,50}\b(?:unrestricted|no\s+restrictions|safety\s+filters?|guardrails?|all\s+rules)\b'
    description: "Afirmación de autoridad no autenticada para modificar restricciones"
    severity: "high"
    enabled: true
  - name: "secret_obfuscation_en"
    pattern: '\b(?:encode|convert|obfuscate)\b.{0,45}\b(?:password|secret|private\s+key|token)\b.{0,50}\b(?:base\s*64|hide|nobody\s+notices|avoid\s+detection)\b'
    description: "Posible intento de ocultar una credencial; no bloquear Base64 aislado"
    severity: "medium"
    enabled: true

  - name: "direct_secret_exfiltration_es"
    pattern: '\b(?:publica|incluye|imprime|enumera|devuelve|copia|entrega|mu[eé]strame|muestra|escribe|exporta|revela|filtra|comparte)\b[\s\S]{0,100}\b(?:contrase[ñn]a\s+(?:de\s+servicio|almacenada|actual|interna)|token\s+(?:restringido|privado|interno|activo)|credenciales\s+(?:reservadas|privadas|internas|del\s+entorno)|secreto\s+(?:interno|protegido|almacenado)|clave\s+de\s+acceso\s+(?:interna|privada))\b'
    description: "Orden explícita de extraer credenciales protegidas; no veto por mero vocabulario"
    severity: "high"
    enabled: true
  - name: "disable_rules_direct_es"
    pattern: '\b(?:olvida|ignora|omite|desobedece)\s+(?:todas?\s+)?(?:las\s+)?(?:reglas|pol[ií]ticas|controles)\s+de\s+(?:seguridad|protecci[oó]n|privacidad)\b'
    description: "Orden directa de anular controles, revisando contexto de citas"
    severity: "high"
    enabled: true

# Señales benignas explícitas. Una coincidencia completa da score 0 y permite
# omitir el veto ML únicamente cuando ninguna regla maliciosa coincide.

  # Explicit override of higher-trust directives; ordinary changes of user task are not hard-vetoed.
  - name: "forget_previous_instructions_context_en"
    pattern: '(?i)\bforget\s+(?:about\s+)?(?:all\s+)?(?:the\s+)?(?:previous\s+)?(?:instructions|demands?|rules|commands|everything)\b'
    description: "Contextual signal of a change of instructions; needs authority analysis"
    severity: "medium"
    enabled: true

  # Mention of DAN without explicit bypass is a signal, not sufficient grounds to block.
  - name: "dan_persona_signal_bilingual"
    pattern: '(?i)\b(?:como|modo|personalidad|as|mode|personality)\s+dan\b|\b(?:la\s+otra\s+personalidad\s+es|the\s+other\s+personality\s+is)\s+dan\b'
    description: "Bilingual DAN reference; avoid blocking quoted or fictional mentions"
    severity: "medium"
    enabled: true

  # High confidence requires a second, explicit instruction to behave contrary to instructions.
  - name: "dual_persona_bypass_bilingual"
    pattern: '(?i)\b(?:you\s+(?:must|should|will)\s+(?:respond|answer)|debes\s+responder|vas\s+a\s+responder|responde)\b[\s\S]{0,700}\b(?:the\s+other\s+personality\s+is|la\s+otra\s+personalidad\s+es)\s+dan\b[\s\S]{0,240}\b(?:opposite|opuesta|opuesto|sin\s+restricciones|without\s+restrictions|ignore\s+rules|ignora\s+(?:las\s+)?reglas)\b'
    description: "Dual assistant persona with an explicit contradictory/unrestricted behavior request"
    severity: "high"
    enabled: true

  - name: "evil_roleplay_context_signal"
    pattern: '(?i)\b(?:pretend\s+(?:you\s+are|to\s+be)|finge\s+(?:que\s+eres|ser)|act\s+as)\s+(?:an?\s+)?(?:evil\s+(?:ai|assistant|bot)|(?:una\s+)?ia\s+malvada)\b'
    description: "Roleplay is not by itself instruction-hierarchy manipulation"
    severity: "medium"
    enabled: true

  - name: "concealed_credential_exfiltration_en"
    pattern: '(?i)\b(?:encode|convert|obfuscate)\b[\s\S]{0,60}\b(?:password|secret|private\s+key|token|credential)\b[\s\S]{0,95}\b(?:so\s+nobody\s+notices|avoid\s+detection|to\s+hide\s+(?:it|the\s+secret)|without\s+(?:anyone|the\s+user)\s+noticing)\b'
    description: "Explicitly conceal a credential from detection; does not match benign Base64 usage alone"
    severity: "high"
    enabled: true

benign:
  - name: "authorized_payroll_read"
    applies_to_roles: ["admin"]
    pattern: '^\s*(?:consulta|dime|muestra)\s+el\s+(?:sueldo|salario)\s+neto\s+mensual\s+registrado\s+de\s+[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+(?:\s+[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+){0,3}\.?(?:\s+Responde\s+solo\s+ese\s+dato\.)?\s*$'
    description: "Lectura completa de nómina para admin; ACL y Output Guard siguen siendo obligatorios"
  - name: "assistant_capabilities"
    pattern: '^\s*[¿¡]?(?:(?:hola+|buenas|oye)[\s,!.¿?]+)?(?:(?:dime|cu[eé]ntame|expl[ií]came|mu[eé]strame|lista|enumera)\s+)?(?:(?:qu[eé]|(?:todo\s+)?lo\s+que)\s+(?:puedes|puedo|podemos)\s+(?:hacer|ahcer|hcaer)|qu[eé]\s+(?:haces|sabes\s+hacer|servicios\s+ofreces)|(?:cu[aá]les\s+son\s+)?(?:tus|mis|las)\s+(?:capacidades|funciones|permisos|herramientas)(?:\s+(?:disponibles|actuales|autorizadas))?|(?:en\s+qu[eé]|c[oó]mo)\s+(?:me\s+)?puedes\s+ayudar(?:me)?|qu[eé]\s+(?:funciones|herramientas)\s+(?:tienes|tengo))(?:\s+(?:en\s+(?:este\s+)?(?:chat|promption\s+shop)|con\s+mi\s+(?:cuenta|sesi[oó]n)|por\s+m[ií]))?(?:\s+y\s+qu[eé]\s+no(?:\s+puedes\s+hacer)?)?[\s,!.¿?]*(?:por\s+favor|porfa)?[\s,!.¿?]*$'
    description: "Pregunta completa sobre funciones o permisos; no autoriza herramientas ni datos"
  - name: "business_discount_policy"
    pattern: '^\s*[¿¡]?(?:por\s+favor[,:]?\s+)?(?:dame|mu[eé]strame|expl[ií]came|cu[aá]l\s+es|cu[aá]les\s+son)\s+(?:tu|tus|la|las|su|sus)\s+pol[ií]ticas?\s+(?:de|sobre)\s+(?:descuentos?|promociones)(?:\s+de\s+la\s+tienda)?(?:[,;]?\s+por\s+favor)?\s*[.!?]*\s*$'
    description: "Consulta completa de política comercial; los permisos se validan por separado"
  - name: "politeness"
    pattern: "^\\s*(gracias|muchas gracias|por favor|porfa|thank you|thanks|please)\\s*[.!¡¿?]*\\s*$"
    description: "Cortesía breve y completa"
  - name: "greeting"
    pattern: "^\\s*(hola|buenos d[íi]as|buenas tardes|buenas noches|hello|hi|hey)(?:[, ]+¿?(?:c[oó]mo est[aá]s?|qu[eé] tal))?\\s*[.!¡¿?]*\\s*$"
    description: "Saludo breve y completo"
  - name: "short_acknowledgement"
    pattern: "^\\s*(ahora\\s+s[ií]|ya|ok(?:ay)?|vale|listo|entendido|perfecto|de acuerdo|s[ií]|no)\\s*[.!¡¿?]*\\s*$"
    description: "Confirmación o seguimiento conversacional breve"

scores:
  high: 1.0
  medium: 0.7
  low: 0.4

scoring:
  # Combined heuristic score for a prompt = max severity found.
  # A prompt is heuristically blocked when score >= heuristic_threshold.
  heuristic_threshold: 0.8
  unknown_score: 0.5
  max_matches: 5

conversation_rules:
  - name: assembled_instruction_override
    pattern: '(?:ignore|disregard|forget)(?:all|the|your)?(?:previous|prior|above|earlier)instructions|(?:ignora|olvida|desobedece)(?:las|tus|todaslas|todas)?instrucciones(?:anteriores|previas)|(?:disable|bypass|desactiva|evita)(?:the|el|la)?(?:securityfilter|safetyfilter|filtrodeseguridad|controlesdeseguridad)'
    enabled: true
  - name: tool_instruction_promotion
    pattern: '(?:herramienta|tool result|p[aá]gina|webpage|documento|document).{0,160}(?:tendr[aá] prioridad sobre.{0,40}(?:reglas|instrucciones|sistema)|(?:como|as|become|son|are) (?:nuevas |new )?(?:instrucciones (?:del? )?sistema|system instructions))'
    enabled: true
