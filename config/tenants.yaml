# ============================================================
# Tenants del Filter API (multi-negocio).
#
# Cada negocio consume la API con su propia X-API-Key y obtiene:
#   - aislamiento en logs/auditoría (tenant_id en cada decisión)
#   - umbrales propios (heuristic / ml / final)
#
# SEGURIDAD: las keys de este archivo son SOLO para demo local.
# En producción define PIF_API_KEYS="tenant:key,otro:key2" como
# variable de entorno (o secret): prevalece sobre este archivo
# y nunca se commitea.
# ============================================================

tenants:
  - tenant_id: "demo-shop"
    name: "Demo Shop (tienda de ejemplo)"
    api_key: "pif_demo_shop_123456"
    thresholds:
      heuristic: 0.6
      ml: 0.5
      final: 0.5

  - tenant_id: "acme-bank"
    name: "Acme Bank (perfil estricto de ejemplo)"
    api_key: "pif_demo_bank_123456"
    thresholds:
      heuristic: 0.6
      ml: 0.4
      final: 0.4
