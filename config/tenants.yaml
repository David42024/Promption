# ============================================================
# Tenants del Filter API (multi-negocio).
#
# Cada negocio consume la API con su propia X-Promption-API-Key y obtiene:
#   - aislamiento en logs/auditoría (tenant_id en cada decisión)
#   - umbrales propios (heuristic / ml / final)
#
# SEGURIDAD Y MODO DEMO:
# Las claves de este archivo son EXCLUSIVAMENTE para demostración local.
# Se cargan únicamente si se define explícitamente PROMPTION_DEMO_MODE=true.
# Por defecto, el modo demo está desactivado y estas claves públicas NO se cargan.
#
# En entornos de producción (ENVIRONMENT=production / PROMPTION_ENV=production),
# el modo demo está estrictamente prohibido y la API rechazará su inicio.
# Para despliegues y producción, defina PROMPTION_API_KEYS="tenant:key,otro:key2"
# como variable de entorno o secreto. Al existir un registro de entorno, las
# claves demo se ignoran por completo garantizando precedencia de credenciales.
# ============================================================

tenants:
  - tenant_id: "demo-shop"
    name: "Demo Shop (tienda de ejemplo)"
    api_key: "pif_demo_shop_123456"
    roles: ["cliente"]
    scopes: ["filter", "output_guard"]
    thresholds:
      heuristic: 0.6
      ml: 0.6
    quotas:
      requests_per_minute: 60
      benchmarks_per_hour: 1

  - tenant_id: "acme-bank"
    name: "Acme Bank (perfil estricto de ejemplo)"
    api_key: "pif_demo_bank_123456"
    roles: ["admin"]
    scopes: ["filter", "output_guard"]
    thresholds:
      heuristic: 0.6
      ml: 0.6
    quotas:
      requests_per_minute: 120
      benchmarks_per_hour: 5

  # Credencial pública de sandbox solicitada para probar la integración.
  # No usar esta clave predecible para datos ni tráfico de producción.
  - tenant_id: "tenant123.unitru"
    name: "Unitru (sandbox)"
    api_key: "pk-123-tenant123.unitru"
    scopes: ["filter", "output_guard"]
    thresholds:
      heuristic: 0.6
      ml: 0.6
    quotas:
      requests_per_minute: 60
      benchmarks_per_hour: 1
